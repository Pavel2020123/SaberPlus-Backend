name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
      - name: Verificar panel sin dependencias externas
        run: npm run check
      - name: Probar panel y servidor demo aislado
        run: npm test
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci --include=dev

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test -- --runInBand

      - name: Probar controles del entorno local aislado
        run: node --test tool/local_control_file.test.mjs tool/local_competitive_control.test.cjs

      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev
